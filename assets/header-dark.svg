<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Leonardo Macedo — Desenvolvedor Full Stack">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1C2333" stroke-width="1"/>
    </pattern>
    <linearGradient id="fadeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.15"/>
    </linearGradient>
    <mask id="fade"><rect width="1200" height="320" fill="url(#fadeGrad)"/></mask>
    <radialGradient id="glowA" cx="82%" cy="15%" r="55%">
      <stop offset="0" stop-color="#6C63FF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#6C63FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="5%" cy="100%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C63FF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <style>
    .mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace}
    .l{animation:in .35s ease both}
    .d1{animation-delay:.2s}.d2{animation-delay:.7s}.d3{animation-delay:1.3s}
    .d4{animation-delay:1.8s}.d5{animation-delay:2.4s}.d6{animation-delay:2.9s}.d7{animation-delay:3.4s}
    @keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
    .cur{animation:blink 1s step-end infinite}
    @keyframes blink{50%{opacity:0}}
    .scan{animation:scan 7s linear infinite}
    @keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(340px)}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.35}}
  </style>

  <rect width="1200" height="320" fill="#0B0E14"/>
  <rect width="1200" height="320" fill="url(#grid)" mask="url(#fade)"/>
  <rect width="1200" height="320" fill="url(#glowA)"/>
  <rect width="1200" height="320" fill="url(#glowB)"/>
  <rect class="scan" x="0" y="0" width="1200" height="2" fill="#6C63FF" opacity=".18"/>

  <!-- identidade -->
  <g class="mono">
    <text x="60" y="98" font-size="15" fill="#6C63FF">// full-stack · software engineering</text>
    <text x="58" y="158" font-size="52" font-weight="700" fill="#E6EDF3" letter-spacing="-1">Leonardo Macedo</text>
    <text x="60" y="198" font-size="21" fill="#8B95A8">Desenvolvedor Full Stack<tspan fill="#22D3EE" class="cur">_</tspan></text>
    <rect x="60" y="218" width="140" height="4" rx="2" fill="url(#accent)"/>

    <g font-size="13" fill="#A5ADBA">
      <rect x="60" y="246" width="68" height="28" rx="6" fill="#111726" stroke="#2A3245"/>
      <text x="94" y="265" text-anchor="middle">APIs</text>
      <rect x="138" y="246" width="60" height="28" rx="6" fill="#111726" stroke="#2A3245"/>
      <text x="168" y="265" text-anchor="middle">SQL</text>
      <rect x="208" y="246" width="76" height="28" rx="6" fill="#111726" stroke="#2A3245"/>
      <text x="246" y="265" text-anchor="middle">Linux</text>
      <rect x="294" y="246" width="68" height="28" rx="6" fill="#111726" stroke="#2A3245"/>
      <text x="328" y="265" text-anchor="middle">LLMs</text>
      <rect x="372" y="246" width="96" height="28" rx="6" fill="#111726" stroke="#2A3245"/>
      <text x="420" y="265" text-anchor="middle">Legados</text>
    </g>
  </g>

  <!-- terminal -->
  <g class="mono">
    <rect x="690" y="44" width="456" height="240" rx="12" fill="#0F1420" stroke="#232B3D"/>
    <path d="M690 56a12 12 0 0 1 12-12h432a12 12 0 0 1 12 12v18H690z" fill="#141A28"/>
    <circle cx="712" cy="60" r="5.5" fill="#FF5F57"/>
    <circle cx="730" cy="60" r="5.5" fill="#FEBC2E"/>
    <circle cx="748" cy="60" r="5.5" fill="#28C840"/>
    <text x="918" y="64" font-size="12" fill="#5C6577" text-anchor="middle">leonardo@prod: ~</text>

    <g font-size="14">
      <text class="l d1" x="712" y="106"><tspan fill="#22D3EE">$</tspan><tspan fill="#E6EDF3"> whoami</tspan></text>
      <text class="l d2" x="712" y="130" fill="#8B95A8">leonardo-macedo</text>
      <text class="l d3" x="712" y="162"><tspan fill="#22D3EE">$</tspan><tspan fill="#E6EDF3"> cat stack.json | jq .core</tspan></text>
      <text class="l d4" x="712" y="186" fill="#A78BFA">["ts","node","php","postgres"]</text>
      <text class="l d5" x="712" y="218"><tspan fill="#22D3EE">$</tspan><tspan fill="#E6EDF3"> systemctl status dev</tspan></text>
      <text class="l d6" x="712" y="242"><tspan fill="#28C840" class="pulse">●</tspan><tspan fill="#8B95A8"> active (running) · em produção</tspan></text>
      <text class="l d7" x="712" y="270"><tspan fill="#22D3EE">$</tspan><tspan fill="#E6EDF3" class="cur"> _</tspan></text>
    </g>
  </g>

  <rect x="0" y="318" width="1200" height="2" fill="url(#accent)" opacity=".7"/>
</svg>
